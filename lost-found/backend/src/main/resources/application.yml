server:
  port: 8080
  # 修复 B-07：反向代理（Nginx）后按 X-Forwarded-For 重写 remoteAddr，
  # 否则匿名访客浏览量去重会退化成"全站共用一把 key"（配合 docs/12 的 proxy_set_header）
  forward-headers-strategy: native
  # 修复 F-11 配套：静态产物（约 1.6MB JS/CSS）开 gzip，花生壳免费穿透只有 1Mbps，
  # 不压缩首屏要 10s+ 才出画面（用户侧表现为长时间"白屏"）；gzip 后约 450KB。
  compression:
    enabled: true
    mime-types: text/html,text/css,text/plain,application/javascript,application/json,application/xml,image/svg+xml
    min-response-size: 1024
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: lost-found-backend
  # 默认激活 local（读取工作目录下的 application-local.yml）；可用环境变量覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lost_found?serverTimezone=Asia/Shanghai&useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    # 默认留空：缺失 application-local.yml 或未设环境变量时启动会因连接失败明确报错（不静默 fallback，审查 2.2）
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  sql:
    init:
      mode: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.shiguang.lostfound.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# 上传文件落盘目录；可用环境变量 UPLOAD_DIR 覆盖；部署手册固定 java -jar 工作目录（审查 2.42）
file:
  upload-dir: ${UPLOAD_DIR:./uploads}

# JWT：真实密钥外置在 application-local.yml 或环境变量 JWT_SECRET（审查 2.2）
jwt:
  secret: ${JWT_SECRET:}
  expire-minutes: 1440        # 默认 1 天（不勾"记住我"）
  remember-minutes: 43200     # 勾"记住我"= 30 天（审查 2.40）
  header: Authorization
  prefix: "Bearer "

# 以图搜图算法参数
image-search:
  bit-resolution: 64
  # 03 T-02 标定（2026-10-15 网格扫描，见 scripts/recall_results.csv 与 docs/11 §2.4）：
  # 真实种子库端到端召回 top-n=6→53.6%（截断）、top-n=10/th=12→85.7% 且误检 0；
  # th=12 同时是 docs/11 mild 组 pHash F1 峰值；更高阈值召回略升但留误检余量不足，弃用
  hamming-threshold: 12
  top-n: 10
  # 修复 Z-08：是否允许 /api/search/image 的 threshold/topN 入参覆盖配置（eval_recall.py 网格扫描用）；
  # 开启时入参 clamp 到 topN∈[1,50]、threshold∈[0,64]；prod profile 关闭（见 application-prod.yml）
  allow-override: true

# CORS（修复 Z-03）：开发期前端走 Vite 代理本就是同源；通配 "*" + allowCredentials(true) 已移除
# （Bearer 鉴权无 Cookie，凭证放行无收益纯风险面）。确有跨域来源时在此显式列出。
# M-P1：Capacitor 源（Android WebView=https://localhost，iOS=capacitor://localhost）加入默认放行；
# P3：桌面壳渲染层是 file:// 源（Origin: null），跨域连后端必须放行 null——
# 鉴权走 Bearer 无 Cookie，null 源可调用的仅限未登录端点，风险可接受（见 docs/12）。
web:
  cors:
    allowed-origins: ${WEB_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://localhost,capacitor://localhost,null}

# P3 发行：后端同时托管已构建前端（浏览器直接开服务器地址即完整网站；iOS PWA 也靠它）
# 目录指 frontend/dist；服务器部署时把 dist 与 jar 放同目录结构或用环境变量覆盖
app:
  frontend-dist-dir: ${FRONTEND_DIST_DIR:../frontend/dist}

# 演示账号口令外置在 application-local.yml；为空则回退随机口令并打印警告（审查 2.3）
seed:
  admin-password: ${SEED_ADMIN_PASSWORD:}
  user-password: ${SEED_USER_PASSWORD:}

# 接口文档：local 开启；生产 profile 关闭（审查 2.42）
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /doc.html

logging:
  level:
    com.shiguang.lostfound: info
