server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: lost-found-backend
  # 默认激活 local（读取工作目录下的 application-local.yml）；可用环境变量覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lost_found?serverTimezone=Asia/Shanghai&useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    # 默认留空：缺失 application-local.yml 或未设环境变量时启动会因连接失败明确报错（不静默 fallback，审查 2.2）
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  sql:
    init:
      mode: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.shiguang.lostfound.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# 上传文件落盘目录；可用环境变量 UPLOAD_DIR 覆盖；部署手册固定 java -jar 工作目录（审查 2.42）
file:
  upload-dir: ${UPLOAD_DIR:./uploads}

# JWT：真实密钥外置在 application-local.yml 或环境变量 JWT_SECRET（审查 2.2）
jwt:
  secret: ${JWT_SECRET:}
  expire-minutes: 1440        # 默认 1 天（不勾"记住我"）
  remember-minutes: 43200     # 勾"记住我"= 30 天（审查 2.40）
  header: Authorization
  prefix: "Bearer "

# 以图搜图算法参数
image-search:
  bit-resolution: 64
  hamming-threshold: 10       # 汉明距离阈值（实验标定后回填，审查 1.3）
  top-n: 6

# 演示账号口令外置在 application-local.yml；为空则回退随机口令并打印警告（审查 2.3）
seed:
  admin-password: ${SEED_ADMIN_PASSWORD:}
  user-password: ${SEED_USER_PASSWORD:}

# 接口文档：local 开启；生产 profile 关闭（审查 2.42）
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /doc.html

logging:
  level:
    com.shiguang.lostfound: info
