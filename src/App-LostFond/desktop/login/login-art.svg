    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F8D09B" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#F1B675" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#F1B675" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
