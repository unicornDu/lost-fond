<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161614" />
    <meta name="color-scheme" content="light dark" />
    <title>拾光 · 校园失物招领平台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23161614'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23FAFAF8'%3E拾%3C/text%3E%3C/svg%3E" />
    <!-- 修复 Z-11：移除 fonts.loli.net 外链字体——内网/单机部署不引外部资源，标题字体走系统回退栈
         （--font-display 已收敛为系统字体，见 docs/05） -->
    <!-- 主题预置：在样式加载前把 data-theme 落到 <html>，避免暗色用户看到一帧亮色 -->
    <script>
      try {
        var t = localStorage.getItem('shiguang_theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <style>
      body { background: #FAFAF8; }
      html.dark body { background: #131312; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
