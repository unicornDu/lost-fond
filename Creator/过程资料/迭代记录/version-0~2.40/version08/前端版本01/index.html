<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>示例工作室 | 首页</title>
  <meta name="description" content="这里是描述文字——站点简介占位。">
  <!-- 字体：Jost 为 Cera Pro 的免费近似替代（几何无衬线） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<!-- data-header="light"：横幅为深色底，页头反白 -->
<body data-page="home" data-header="light">

  <!-- 页头 -->
  <header class="header">
    <div class="header-logo"><a href="index.html"></a></div>
    <div class="header-right">
      <nav class="menu-desktop" aria-label="主导航">
        <ul class="menu-desktop-links" style="display:flex;gap:var(--gap)"></ul>
        <div class="languages"></div>
      </nav>
      <button class="menu-toggle" aria-expanded="false" aria-controls="menu-overlay" aria-label="菜单">
        <span class="menu-toggle-open">menu</span>
        <span class="menu-toggle-close" aria-hidden="true">close</span>
      </button>
    </div>
  </header>

  <!-- 移动端全屏菜单 -->
  <nav class="menu-overlay" id="menu-overlay" aria-label="移动端导航">
    <ul class="menu-overlay-links"></ul>
    <div class="languages"></div>
  </nav>

  <!-- 首页：全屏纵向轮播（内容由 main.js 从 SITE_CONTENT 渲染） -->
  <main class="home-banners swiper">
    <div class="swiper-wrapper"></div>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <ul class="footer-grid">
      <li class="contacts"></li>
      <li class="address"><a href="#" target="_blank" rel="noopener"></a></li>
      <li><span class="scroll-hint"></span></li>
    </ul>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
